name: ci
on: [push, pull_request]
jobs:
  check-no-game-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if game files or keys are committed
        run: |
          if git ls-files | grep -E '\.(3ds|cia|cci|nsp|xci|keys)$|prod\.keys'; then
            echo "Game files or keys found in repo"; exit 1
          fi
